# ============================================================================
# pyproject.toml —— ContractForge 项目工程化配置（构建 + 代码质量 + 测试）
#
# 与 RAG 项目（rag-from-llm-ai）、Agent 项目（agentforge）保持一致的工程规范：
# ruff / mypy / pytest。
# ============================================================================

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contractforge"
version = "0.1.0"
description = "ContractForge：智能合同审查与审批协作平台（真实业务场景 + 企业级 + 全栈）"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=23.1",
    "arq>=0.28.0",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "minio>=7.2.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "N"]
ignore = ["E501", "N802", "N806"]

[tool.mypy]
python_version = "3.12"
strict = false
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]
markers = [
    "integration: 依赖外部服务（qwen-max / PostgreSQL+pgvector / Redis）的集成测试",
    "integration: 依赖外部服务（PostgreSQL/Redis/MinIO）的集成测试",
    "llm: 会真实调用 LLM 的测试，CI 默认跳过",
    "eval: golden set 评测回归（M2 起）",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]
